version: '3.8'

services:
  # 1. FastAPI REST Backend Service
  backend-api:
    build: .
    container_name: fairrank_backend_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Streamlit Dashboard Frontend Service (legacy demo, kept for reference)
  frontend-dashboard:
    build: .
    container_name: fairrank_dashboard
    command: streamlit run demo/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend-api:8000
    depends_on:
      - backend-api
    volumes:
      - .:/app

  # 3. React + Vite Dashboard Frontend Service (primary UI)
  frontend-web:
    build: ./frontend
    container_name: fairrank_frontend_web
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
