[project]
name = "tmg301-cv-jd-fairness"
version = "0.1.0"
description = "Fairness-Aware Semantic Resume Ranking: An Empirical Audit of Utility and Robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "openai>=1.20.0",
    "google-generativeai>=0.5.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
